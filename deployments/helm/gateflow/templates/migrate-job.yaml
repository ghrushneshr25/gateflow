apiVersion: batch/v1
kind: Job
metadata:
  # Revision suffix so upgrades create a fresh Job (Jobs are immutable).
  name: {{ include "gateflow.fullname" . }}-migrate-r{{ .Release.Revision }}
  labels:
    {{- include "gateflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "gateflow.postgresHost" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateflow.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateflow.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateflow.fullname" . }}-secrets
                  key: DATABASE_URL
