apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateflow.fullname" . }}-secrets
  labels:
    {{- include "gateflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEFLOW_DEV_JWT_SECRET: {{ .Values.jwt.secret | quote }}
  GATEFLOW_GOOGLE_CLIENT_ID: {{ .Values.google.clientId | quote }}
  GATEFLOW_ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  GATEFLOW_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  # Lab-only roles from init.sql (documented local defaults)
  DATABASE_URL: {{ include "gateflow.dbURL" . | quote }}
  SALE_DATABASE_URL: {{ printf "%s&search_path=sale" (include "gateflow.dbURL" .) | quote }}
  ADMISSION_DATABASE_URL: {{ printf "%s&search_path=admission" (include "gateflow.dbURL" .) | quote }}
  INVENTORY_DATABASE_URL: {{ printf "%s&search_path=inventory" (include "gateflow.dbURL" .) | quote }}
  ORDER_DATABASE_URL: {{ printf "%s&search_path=order" (include "gateflow.dbURL" .) | quote }}
  PAYMENT_DATABASE_URL: {{ printf "%s&search_path=payment" (include "gateflow.dbURL" .) | quote }}
