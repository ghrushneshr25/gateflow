{{- $root := . -}}
{{- $ns := include "gateflow.fullname" . -}}
{{- $kafka := printf "%s:9092" (include "gateflow.kafkaHost" .) -}}
{{- range $key, $app := dict
  "sale" .Values.apps.sale
  "admission" .Values.apps.admission
  "inventory" .Values.apps.inventory
  "order" .Values.apps.order
  "payment-simulator" .Values.apps.paymentSimulator
}}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ns }}-{{ $key }}
  labels:
    {{- include "gateflow.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  ports:
    - port: {{ $app.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $key }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ns }}-{{ $key }}
  labels:
    {{- include "gateflow.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $key }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $key }}
          image: "{{ $app.image }}:{{ $root.Values.imageTag }}"
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ $app.port }}
              name: http
          env:
            - name: ENVIRONMENT
              value: local
            - name: HTTP_ADDR
              value: ":{{ $app.port }}"
            - name: GATEFLOW_DEV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: GATEFLOW_DEV_JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: DATABASE_URL
            {{- if eq $key "sale" }}
            - name: SALE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: SALE_DATABASE_URL
            - name: INVENTORY_BASE_URL
              value: "http://{{ $ns }}-inventory:{{ $root.Values.apps.inventory.port }}"
            - name: GATEFLOW_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: GATEFLOW_GOOGLE_CLIENT_ID
            - name: GATEFLOW_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: GATEFLOW_ADMIN_USERNAME
            - name: GATEFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: GATEFLOW_ADMIN_PASSWORD
            {{- end }}
            {{- if eq $key "admission" }}
            - name: ADMISSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: ADMISSION_DATABASE_URL
            - name: GATEFLOW_ADMISSION_GRANT_PROTOCOL
              value: {{ $root.Values.admission.grantProtocol | quote }}
            {{- end }}
            {{- if eq $key "inventory" }}
            - name: INVENTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: INVENTORY_DATABASE_URL
            {{- end }}
            {{- if eq $key "order" }}
            - name: ORDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: ORDER_DATABASE_URL
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: {{ $kafka | quote }}
            - name: SALE_BASE_URL
              value: "http://{{ $ns }}-sale:{{ $root.Values.apps.sale.port }}"
            - name: ADMISSION_BASE_URL
              value: "http://{{ $ns }}-admission:{{ $root.Values.apps.admission.port }}"
            - name: INVENTORY_BASE_URL
              value: "http://{{ $ns }}-inventory:{{ $root.Values.apps.inventory.port }}"
            - name: PAYMENT_BASE_URL
              value: "http://{{ $ns }}-payment-simulator:{{ $root.Values.apps.paymentSimulator.port }}"
            {{- end }}
            {{- if eq $key "payment-simulator" }}
            - name: PAYMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-secrets
                  key: PAYMENT_DATABASE_URL
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
