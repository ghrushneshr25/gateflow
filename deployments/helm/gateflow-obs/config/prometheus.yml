global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  # Scrape Gateflow backends in the app namespace (ClusterIP DNS).
  - job_name: gateflow-services
    metrics_path: /metrics
    static_configs:
      - targets: ["gateflow-sale.gateflow.svc.cluster.local:8080"]
        labels:
          service: sale
      - targets: ["gateflow-admission.gateflow.svc.cluster.local:8080"]
        labels:
          service: admission
      - targets: ["gateflow-inventory.gateflow.svc.cluster.local:8080"]
        labels:
          service: inventory
      - targets: ["gateflow-order.gateflow.svc.cluster.local:8080"]
        labels:
          service: order
      - targets: ["gateflow-payment-simulator.gateflow.svc.cluster.local:8080"]
        labels:
          service: payment-simulator
