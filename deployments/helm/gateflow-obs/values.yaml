# Optional lab observability — NOT required for booking correctness.
# Install into its own namespace (default: gateflow-obs).

namespace: gateflow-obs

# Where Gateflow apps live (for Prometheus scrape targets)
appNamespace: gateflow
appRelease: gateflow

images:
  grafana: grafana/grafana:11.3.0
  prometheus: prom/prometheus:v2.55.1
  tempo: grafana/tempo:2.6.1
  loki: grafana/loki:3.2.1
  otel: otel/opentelemetry-collector-contrib:0.114.0

grafana:
  adminUser: admin
  adminPassword: admin   # lab only
  servicePort: 3000

prometheus:
  servicePort: 9090

tempo:
  servicePort: 3200

loki:
  servicePort: 3100

otel:
  grpcPort: 4317
  httpPort: 4318
  metricsPort: 8889

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
