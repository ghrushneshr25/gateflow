global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # OTLP metrics pipeline (traces-adjacent; keep for collector health)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  # Application RED + ops gauges exposed at GET /metrics on each service.
  # Local dev runs services on the host; Docker Desktop provides host.docker.internal.
  - job_name: gateflow-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          service: sale
      - targets:
          - host.docker.internal:8082
        labels:
          service: admission
      - targets:
          - host.docker.internal:8083
        labels:
          service: inventory
      - targets:
          - host.docker.internal:8084
        labels:
          service: order
      - targets:
          - host.docker.internal:8085
        labels:
          service: payment-simulator
