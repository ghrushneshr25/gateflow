receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 64

exporters:
  # Debug to collector logs
  debug:
    verbosity: basic
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Metrics scrape endpoint for Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
  # Optional OTLP logs → Loki (host apps primarily use Promtail on GATEFLOW_LOG_DIR)
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    # OTLP log path for future app exporters; primary local path is Promtail → Loki.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]
