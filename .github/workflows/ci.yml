name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Vet and test
        run: |
          go work sync
          go vet ./libs/go/...
          go test ./libs/go/...
          for s in sale admission inventory order payment-simulator; do
            (cd services/$s && go test ./... && go build -o /tmp/$s ./cmd/server)
          done

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [buyer-web, operator-console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install, typecheck, test, build
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
