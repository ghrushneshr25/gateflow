components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id, retryable, status]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string }
            retryable: { type: boolean }
            status:
              type: string
              enum: [failed, in_progress, ambiguous, conflict]
            details:
              type: object
              additionalProperties: true
